# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径（上传根目录；相对应用运行目录。上传后数据库只存 /profile/upload/... 相对路径，展示时拼 takeout.file.base-url）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 4121
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 自动配置排除：Spring AI 的 RedisVectorStore 自动配置强依赖 JedisConnectionFactory，
  # 与若依的 Lettuce 配置冲突；本项目在 com.ruoyi.merchant.ai.AiBeanConfig 手工装配 VectorStore
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置（docker-compose 环境映射 6379）
    redis:
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  # ============ 二期 AI 智能问答（RAG）============
  ai:
    # 统一走 OpenAI 兼容协议：默认接阿里云百炼（通义千问）
    # 切换到 DeepSeek 或第三方兼容模型：只改 base-url / api-key / chat.options.model 即可；
    # Embedding 按约定固定使用通义（第三方若无 Embedding 接口，保持本节 embedding 配置不动）
    openai:
      # API Key：从环境变量 DASHSCOPE_API_KEY 读取（不要把真实 Key 提交到 Git！）
      # 本地配置方式：系统环境变量，或 IDEA 运行配置的 Environment variables
      api-key: ${DASHSCOPE_API_KEY:}
      # 注意：本网关（百炼 OpenAI 兼容模式）要求 base-url 带 /v1 后缀
      # Spring AI 会在其后拼接 /chat/completions 与 /embeddings
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        options:
          # Chat 模型（可切换为 deepseek-chat / 第三方模型名）
          model: qwen3.7-flash
          temperature: 0.3
      embedding:
        options:
          # Embedding 模型（约定：Embedding 一直使用通义）
          model: qwen3.7-text-embedding
    vectorstore:
      redis:
        # 向量索引名（RedisVectorStore / RediSearch 使用，需 redis-stack 镜像）
        index-name: takeout-ai-index
        prefix: "takeout:ai:vector:"
        # 首次启动自动创建索引（维度由 Embedding 模型自动探测，本版本无需手工配置 dimension）
        initialize-schema: true
        hnsw:
          # HNSW 参数（默认值即可，按需调整）
          m: 16
          ef-construction: 200
          ef-runtime: 10
        # 注意：换 Embedding 模型（维度变化）时必须重建索引：
        #   docker exec takeout-redis redis-cli FT.DROPINDEX takeout-ai-index DD
        #   然后重启后端（会按新维度重新创建索引）

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# ============ 阿婆干饭社业务配置 ============

# 图片/文件访问前缀：完整 URL = base-url + 数据库相对路径（库内只存相对路径，不存域名；迁移 OSS 只改此处）
takeout:
  # WebSocket 端点路径（T15 新订单实时提醒；前端连接 ws://host:port{path}?token=<若依登录token>）
  websocket:
    path: /websocket/order
  file:
    base-url: http://localhost:4121
    # 上传单文件大小上限（T2 统一文件上传模块生效）
    max-size: 5MB
    # 上传格式白名单（T2 统一文件上传模块生效）
    allow-extensions: jpg,jpeg,png,webp
  # 微信小程序配置（真实登录需填入你的小程序 appid/secret）
  wx:
    appid:
    secret:
    # 开发辅助开关：true 时登录 code 直接作为 openid（跳过微信接口），仅限本地开发调试！
    # 部署上线前必须改为 false 并填入真实 appid/secret（与 payment.mock.enabled 同风格）
    mock-enabled: false

  # AI 业务参数（检索与切片，二期）
  ai:
    # 相似度检索 TopK（方案要求 TopK 片段）
    top-k: 4
    # 相似度阈值（低于该值的片段不作为知识依据；太高会导致检索不到）
    similarity-threshold: 0.35
    # 多轮对话携带的历史轮数（1 轮 = 用户问 + 助手答）
    history-rounds: 6
    chunk:
      # 切片目标字符数
      size: 800
      # 切片最小字符数（不足则与相邻合并）
      min-length: 200
      # 小于该长度不参与向量化
      min-embed-length: 50
      # 单次向量化批大小
      max-embed-batch: 20

# RocketMQ：延迟消息超时关单 + 事件消息（消费端幂等）
rocketmq:
  # 降级总开关：false 时消息不发送/不消费，超时关单仅靠定时任务兜底
  enabled: true
  # name-server 地址（docker-compose 环境映射到 localhost:9876）
  name-server: localhost:9876
  producer:
    # 生产者组（占位，T5 下单发延迟消息时启用）
    group: takeout-producer-group
    send-message-timeout: 3000

# 模拟支付开关：仅开发/演示环境启用，上线真实支付必须关闭并替换 WechatPaymentService（二期）
payment:
  mock:
    enabled: true

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
