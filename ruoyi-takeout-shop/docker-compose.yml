# 阿婆干饭社 —— 本地开发环境一键启动（MySQL + Redis + RocketMQ）
# 使用：在本文件所在目录执行  docker compose up -d
# 说明：
#   1) MySQL 首次启动会自动创建 takeout 库，并按文件名顺序执行 sql/ 下的建表脚本
#      （01 若依系统表 -> 02 quartz -> 03 业务 biz_ 表）
#   2) 数据保存在 Docker 卷（takeout-mysql-data / takeout-redis-data），down 不丢数据；
#      需要彻底重置时执行 docker compose down -v（会删除数据，下次启动重新执行建表脚本）
#   3) RocketMQ dashboard 可选：docker compose --profile dashboard up -d
services:

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: takeout-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: takeout
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - takeout-mysql-data:/var/lib/mysql
      - ./sql/ry_20260417.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ./sql/quartz.sql:/docker-entrypoint-initdb.d/02-quartz.sql:ro
      - ./sql/ruoyi-takeout.sql:/docker-entrypoint-initdb.d/03-takeout.sql:ro
      - ./sql/ruoyi-takeout-menu.sql:/docker-entrypoint-initdb.d/04-takeout-menu.sql:ro
      - ./sql/ruoyi-takeout-job.sql:/docker-entrypoint-initdb.d/05-takeout-job.sql:ro
      - ./sql/ruoyi-takeout-ai.sql:/docker-entrypoint-initdb.d/06-takeout-ai.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    # 二期 AI：换用 Redis Stack（内含 RediSearch 模块，RedisVectorStore 向量检索依赖它）。
    # 内核为 Redis 7.4，对一期缓存/token/防重锁完全兼容；数据卷沿用同一个，无需迁移。
    image: docker.m.daocloud.io/redis/redis-stack-server:7.4.0-v3
    container_name: takeout-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - takeout-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.1
    container_name: takeout-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "9876:9876"

  rocketmq-broker:
    image: docker.m.daocloud.io/apache/rocketmq:5.3.1
    container_name: takeout-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
    ports:
      - "20909:20909"
      - "20911:20911"
      - "20913:20913"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro

  # 可选：RocketMQ 控制台（不默认启动）
  # 启动：docker compose --profile dashboard up -d
  # 访问：http://localhost:8180
  rocketmq-dashboard:
    image: docker.m.daocloud.io/apacherocketmq/rocketmq-dashboard:2.0.0
    container_name: takeout-rocketmq-dashboard
    restart: unless-stopped
    profiles:
      - dashboard
    depends_on:
      - rocketmq-namesrv
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080"
    ports:
      - "8180:8080"

volumes:
  takeout-mysql-data:
  takeout-redis-data:
