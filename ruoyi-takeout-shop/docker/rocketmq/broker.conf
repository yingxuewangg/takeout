# RocketMQ Broker 本地开发配置
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 本机客户端通过 localhost 访问，NameServer 返回的 broker 地址必须是 127.0.0.1
brokerIP1 = 127.0.0.1
# Windows 保留区间覆盖 10909-10952，broker 端口改用 20911（VIP/FAST 通道随之变为 20909/20913）
listenPort = 20911
# 本地自动创建 topic/订阅组，便于开发联调（生产环境应关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroupEnable = true
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
